name: Prepare recorded collision sounds
on:
  workflow_dispatch:
  push:
    paths: ['tools/prepare-impacts.py', '.github/workflows/impact-audio.yml']
permissions:
  contents: write
jobs:
  recordings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg is available
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Prepare licensed recordings
        run: python3 tools/prepare-impacts.py impact-recordings.js
      - name: Include the sound bank in the static game
        if: github.ref == 'refs/heads/main'
        run: |
          git add -- impact-recordings.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Package eight recorded impact sounds"
            git push origin HEAD:main
          fi
